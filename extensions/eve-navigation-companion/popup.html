<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Eve Navigation Companion</title>
  <style>
    body{margin:0;width:320px;font-family:ui-rounded,"SF Pro Rounded","Nunito","Avenir Next",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fc;color:#24304d}
    main{padding:18px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:16px}.mark{width:32px;height:32px;border-radius:9px;background:#3758a8;color:#fff;display:grid;place-items:center;font-weight:800}.brand strong{font-size:15px}.card{background:#fff;border:1px solid #dfe5f1;border-radius:12px;padding:14px}.eyebrow{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#71809f;font-weight:800;margin-bottom:6px}p{margin:0;color:#596987;font-size:13px;line-height:1.45}.task{font-weight:700;color:#263657;margin:0 0 8px}.timer{margin-top:10px;font-variant-numeric:tabular-nums;font-weight:700;color:#3758a8}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">E</span><div><strong>Eve Navigation Companion</strong><div style="font-size:11px;color:#71809f">Participant overlay</div></div></div>
    <section class="card" id="status"><div class="eyebrow">Status</div><p>Checking…</p></section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
