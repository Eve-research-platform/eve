name: Promote Eve to stable

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PROMOTE to publish the current main commit as Stable'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  pages: write

concurrency:
  group: eve-pages
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ inputs.confirmation == 'PROMOTE' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Validate Stable candidate
        run: npm run check && npm test
      - name: Resolve release
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION must be x.y.z for Stable" >&2; exit 1; }
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            EXISTING="$(git rev-list -n 1 "v$VERSION")"
            [[ "$EXISTING" == "$GITHUB_SHA" ]] || { echo "v$VERSION already points at another commit" >&2; exit 1; }
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Create immutable Stable tag
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Eve $VERSION"
            git push origin "$TAG"
          else
            echo "$TAG already exists on this commit; continuing the promotion retry."
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Stable container
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Build release assets
        run: bash scripts/build-release-artifacts.sh "$GITHUB_REPOSITORY" dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading/replacing release assets."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Eve v$VERSION" --generate-notes --verify-tag
          fi
      - name: Rebuild public Beta and Stable site
        run: |
          rm -rf _site && mkdir -p _site
          cp public-home.html _site/index.html
          cp deployment.css _site/deployment.css
          bash scripts/stage-deployment-site.sh "$GITHUB_REPOSITORY" beta main beta _site/beta . "${GITHUB_SHA::7}"
          bash scripts/stage-deployment-site.sh "$GITHUB_REPOSITORY" stable "$TAG" "$VERSION" _site/stable . "$TAG"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
